name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Get package info
        id: package_info
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "VSIX_FILE=${PACKAGE_NAME}-${PACKAGE_VERSION}.vsix" >> $GITHUB_OUTPUT
          echo "TAG=v${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Check tag matches package.json version
        run: |
          if [ "$GITHUB_REF_NAME" != "${{ steps.package_info.outputs.TAG }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.package_info.outputs.VERSION }}"
            exit 1
          fi

      # Fail before anything is released if the token is missing or no longer valid.
      - name: Check VSCE token
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "::error::VSCE_TOKEN secret is not set"
            exit 1
          fi
          npx @vscode/vsce verify-pat "$(node -p "require('./package.json').publisher")" -p "$VSCE_TOKEN"

      - name: Build extension
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Verify VSIX file exists
        run: |
          if [ ! -f "${{ steps.package_info.outputs.VSIX_FILE }}" ]; then
            echo "Error: VSIX file not found: ${{ steps.package_info.outputs.VSIX_FILE }}"
            ls -la *.vsix || echo "No .vsix files found"
            exit 1
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_info.outputs.VSIX_FILE }}
          body: |
            ## Changes in this Release

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

            ### Installation
            Download the `.vsix` file and install it in VS Code:
            ```
            code --install-extension ${{ steps.package_info.outputs.VSIX_FILE }}
            ```
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Publish the same VSIX that was attached to the GitHub release.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.package_info.outputs.VSIX_FILE }}" -p "$VSCE_TOKEN"
